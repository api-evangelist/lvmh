aid: lvmh
name: LVMH
description: LVMH Moët Hennessy Louis Vuitton is the world's largest luxury goods
  conglomerate, headquartered in Paris and operating over 75 prestigious brands. Its
  portfolio spans fashion and leather goods (Louis Vuitton, Christian Dior, Fendi,
  Loewe, Celine), wines and spirits (Moët & Chandon, Hennessy, Veuve Clicquot), perfumes
  and cosmetics (Givenchy, Guerlain), watches and jewelry (Tiffany & Co., Bulgari,
  TAG Heuer), and selective retailing (Sephora, DFS). LVMH does not currently publish
  a public developer API or developer portal at the group level; technical and partner
  integrations are handled brand-by-brand and through closed innovation partnerships
  such as the Aura Blockchain Consortium.
