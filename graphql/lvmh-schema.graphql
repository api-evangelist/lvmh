type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ─────────────────────────────────────────
# Root Types
# ─────────────────────────────────────────

type Query {
  brand(id: ID, slug: String): LVMHBrand
  brands(segment: BrandSegment): [LVMHBrand!]!
  louisVuitton: LouisVuitton
  christianDior: ChristianDior
  givenchy: Givenchy
  celine: Celine
  loewe: Loewe
  marcJacobs: MarcJacobs
  fendi: Fendi
  bulgari: Bulgari
  tiffany: Tiffany
  tagHeuer: TagHeuer
  zenith: Zenith
  hublot: Hublot
  domPerignon: DomPerignon
  moet: Moet
  chandon: Chandon
  hennessy: Hennessy

  product(id: ID!): ProductDetails
  products(
    brandId: ID
    categoryId: ID
    collectionId: ID
    minPrice: Float
    maxPrice: Float
    currency: Currency
    first: Int
    after: String
  ): ProductConnection!

  productCategory(id: ID, slug: String): ProductCategory
  productCategories(segment: BrandSegment): [ProductCategory!]!

  collection(id: ID, slug: String): ProductCollection
  collections(brandId: ID, season: String, year: Int): [ProductCollection!]!
  limitedEditions(brandId: ID): [LimitedEdition!]!

  store(id: ID!): Store
  stores(brandId: ID, country: String, city: String, storeType: StoreType): [Store!]!
  nearbyStores(latitude: Float!, longitude: Float!, radiusKm: Float, brandId: ID): [Store!]!

  customer(id: ID!): Customer
  myProfile: Customer

  order(id: ID!): Order
  myOrders: [Order!]!

  apiKey(id: ID!): APIKey
  myApiKeys: [APIKey!]!
}

type Mutation {
  createAppointment(
    storeId: ID!
    appointmentType: AppointmentType!
    preferredDate: DateTime!
    notes: String
  ): AppointmentConfirmation!

  cancelAppointment(appointmentId: ID!): Boolean!

  addToWishlist(productId: ID!): Customer!
  removeFromWishlist(productId: ID!): Customer!

  updateCommunicationPreferences(
    emailMarketing: Boolean
    smsMarketing: Boolean
    newCollectionAlerts: Boolean
    eventInvitations: Boolean
    personalizedOffers: Boolean
  ): CustomerProfile!

  createAPIKey(
    name: String!
    description: String
    brandAccess: [ID!]!
    scopes: [APIScope!]!
  ): APIKey!

  revokeAPIKey(id: ID!): Boolean!

  refreshToken(refreshToken: String!): Token!
}

type AppointmentConfirmation {
  id: ID!
  store: Store!
  appointmentType: AppointmentType!
  confirmedDate: DateTime!
  advisorName: String
  confirmationNumber: String!
  notes: String
}

schema {
  query: Query
  mutation: Mutation
}
