# LVMH Conceptual GraphQL Schema
# Represents the luxury goods ecosystem of LVMH Moet Hennessy Louis Vuitton
# This is a conceptual schema; LVMH does not publish a public group-level API.

scalar DateTime
scalar URL
scalar JSON
scalar Currency

# ─────────────────────────────────────────
# Brand Types
# ─────────────────────────────────────────

interface Brand {
  id: ID!
  name: String!
  slug: String!
  foundedYear: Int
  headquartersCity: String
  headquartersCountry: String
  website: URL
  logoUrl: URL
  description: String
  segment: BrandSegment!
}

enum BrandSegment {
  FASHION_LEATHER_GOODS
  WINES_SPIRITS
  PERFUMES_COSMETICS
  WATCHES_JEWELRY
  SELECTIVE_RETAILING
  OTHER
}

