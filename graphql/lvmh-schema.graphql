}

type LuxuryPrice {
  amount: Float!
  currency: Currency!
  formatted: String!
  priceSegment: PriceSegment!
  msrp: Float
  authenticatedBuyerPrice: Float
  includesTax: Boolean!
}

enum PriceSegment {
  ENTRY_LUXURY
  MID_LUXURY
  HIGH_LUXURY
  ULTRA_HIGH_LUXURY
  BESPOKE
}

type RegionPrice {
  region: String!
  countryCode: String!
  currency: Currency!
  amount: Float!
  formatted: String!
  includesTax: Boolean!
  taxRate: Float
}

